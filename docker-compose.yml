# Docker Compose for Local Development

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: microservices-postgres
    environment:
      POSTGRES_DB: demodb
      POSTGRES_USER: demouser
      POSTGRES_PASSWORD: demopassword
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./services/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demouser"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-network

# API Service
api:
  build:
    context: ./services/api
    dockerfile: Dockerfile
  container_name: microservices-api
  environment:
    NODE_ENV: development
    PORT: 8080
    DB_HOST: postgres
    DB_PORT: 5432
    DB_NAME: demodb
    DB_USER: demouser
    DB_PASSWORD: demopassword
  ports:
    - "8080:8080"
  depends_on:
    postgres:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
    interval: 30s
    timeout: 10s
    retries: 3
  networks:
    - microservices-network
  restart: unless-stopped

# Frontend Service
frontend:
  build:
    context: ./services/frontend
    dockerfile: Dockerfile
  container_name: microservices-frontend
  environment:
    REACT_APP_API_URL: http://localhost:8080/api
  ports:
    - "3000:80"
  depends_on:
    - api
  healthcheck:
    test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
    interval: 30s
    timeout: 10s
    retries: 3
  networks:
    - microservices-network
  restart: unless-stopped

volumes:
  postgres-data:
    driver: local

networks:
  microservices-network:
    driver: bridge