# Ingress for routing external traffic
# Note: Requires nginx-ingress-controller to be installed in AKS
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microservices-ingress
  namespace: microservices-demo
  labels:
    app: microservices-demo
  annotations:
    # Nginx Ingress Controller annotations
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # Security annotations
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"

    # Rate Limiting
    nginx.ingress.kubernetes.io/limit-rps: "100"

    # Timeouts
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"

spec:
  ingressClassName: nginx
  # TLS configuration (uncomment when certificate is ready)
  # tls:
  # - hosts:
  #     - microservices-demo.example.com
  #   secretName: microservices-tls
  rules:
  - host: microservices-demo.example.com  # Replace with your domain
    http:
      paths:
      # Frontend routes - Only expose frontend to the internet
      # Frontend will make internal API calls to api-service.microservices-demo.svc.cluster.local
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80