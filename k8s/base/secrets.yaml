# Secret for database credentials
# WARNING: In production, use Azure Key Vault with CSI Secret Store driver
# Base64 encoded values (for demo purposes only)
# demouser = ZGVtb3VzZXI=
# demopassword = ZGVtb3Bhc3N3b3Jk
# demodb = ZGVtb2Ri

apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: microservices-demo
  labels:
    app: postgres
type: Opaque
data:
  POSTGRES_USER: ZGVtb3VzZXI=
  POSTGRES_PASSWORD: ZGVtb3Bhc3N3b3Jk
  POSTGRES_DB: ZGVtb2Ri

---

# Secret for API service database connection
apiVersion: v1
kind: Secret
metadata:
  name: api-secret
  namespace: microservices-demo
  labels:
    app: api
type: Opaque
data:
  DB_USER: ZGVtb3VzZXI=
  DB_PASSWORD: ZGVtb3Bhc3N3b3Jk